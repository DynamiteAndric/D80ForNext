# Publish a GitHub release when a version tag is pushed:
#
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0
#
# The runner has neither sjasmplus nor the MDOS/48K ROMs (they are not in
# git), so it packages the committed dist/dot/D80 and the tests that need the
# ROMs are skipped. Build and run the full tests locally before tagging.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write          # create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: tag check and generated notes

      - name: The tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Check, test and package
        run: python3 tools/make_release.py "$GITHUB_REF_NAME" --package-only

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists already (tools/make_release.py made it)"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "out/d80-$GITHUB_REF_NAME.zip" \
            --title "D80 $GITHUB_REF_NAME" --generate-notes
